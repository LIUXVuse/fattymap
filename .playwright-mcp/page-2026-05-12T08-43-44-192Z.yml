            - paragraph [ref=e886]:
              - strong [ref=e887]: •
              - text: Renewal bookings are only applicable to the device linked to the original booking and do not support device changes. If you need to change the device, please do not purchase a renewal booking.
            - paragraph [ref=e888]:
              - strong [ref=e889]: •
              - text: When the data traffic from the original booking's eSIM is exhausted, you can tap the "Renewal" button on the original booking page to purchase a renewal booking. The renewed package and expiration date will be automatically added to the original booking.
            - paragraph [ref=e890]:
              - strong [ref=e891]: •
              - text: If the eSIM from the original booking has not been deleted from the device, there is no need to reinstall the eSIM, and you can directly use the renewed data traffic.
            - paragraph [ref=e892]:
              - strong [ref=e893]: Activation rules for booking renewal
            - paragraph [ref=e894]: After the original package's data is used up, the speed will be reduced, but the renewed traffic will only be activated after the original package's validity period ends. To terminate the original package early and activate the renewed traffic, please contact customer support.
            - paragraph [ref=e895]:
              - strong [ref=e896]: Disable domestic SIM card roaming
            - paragraph [ref=e897]: Before using eSIM, be sure to disable data roaming on your domestic SIM card to avoid high international roaming charges from using your domestic mobile network. You are responsible for all related costs, including roaming fees, overseas SIM card/eSIM purchase expenses, and transportation fees, with no additional compensation provided.
            - paragraph [ref=e898]:
              - strong [ref=e899]: Adhering to fair data usage principles
            - paragraph [ref=e900]: To ensure internet quality and comply with fair data usage principles (FUP), operators may monitor users who excessively consume data within a short period, which may result in connection interruptions or reduced speeds.
            - paragraph [ref=e901]: To maintain a stable connection, it is recommended to avoid high-data-consumption activities such as streaming/downloading long videos, software updates, or internet sharing (hotspot).
